<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>16 PLAYER TOURNAMENT</title>
<style>
:root{--bg:#07090f;--panel:#0e1320;--line:#263044;--text:#f5f7fb;--muted:#8d98ad;--gold:#ffd45a;--blue:#5aa9ff;--green:#53e6a5;--red:#ff5f6d}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,#24365e 0,#07090f 45%);overflow-x:hidden;color:var(--text);font-family:Inter,Pretendard,Arial,sans-serif;min-height:100vh}
header{padding:28px 18px 18px;text-align:center;border-bottom:1px solid #171e2c;position:sticky;top:0;background:rgba(7,9,15,.86);backdrop-filter:blur(14px);z-index:5}
.logo{font-size:12px;letter-spacing:5px;color:var(--gold);font-weight:800}.title{font-size:clamp(25px,6vw,44px);font-weight:900;margin:7px 0;text-shadow:0 0 35px #fff3}.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1250px;margin:auto;padding:20px}.tabs{display:flex;justify-content:center;gap:8px;margin:4px 0 18px}.tab{min-width:120px}.tab.active{background:var(--gold);color:#06101c}.tab.secondary{background:#121a29;color:#dce4f2;border:1px solid #2a3750}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
button{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer;color:#06101c;background:var(--gold);box-shadow:0 8px 30px #0006}
button.secondary{background:#192235;color:#e9edf6;border:1px solid #2a3750}button.danger{background:#ff5f6d;color:white}
h2{font-size:18px;margin:22px 0 12px}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.group{background:linear-gradient(180deg,#111827,#0c111b);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 15px 40px #0005}
.group h3{margin:0 0 10px;color:var(--gold);font-size:14px;letter-spacing:1px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 5px;border-bottom:1px solid #1d2636;font-size:12px;text-align:center}th{color:var(--muted);font-weight:700}td:first-child,th:first-child{text-align:left}
input{width:100%;background:#080d16;color:#fff;border:1px solid #26334a;border-radius:8px;padding:7px 8px;outline:none}input:focus{border-color:var(--gold)}
.score{width:54px;text-align:center}.rank1{color:var(--gold);font-weight:900}.rank2{color:#dfe7f4;font-weight:900}.rank3{color:#b89b78;font-weight:900}
.card{background:linear-gradient(180deg,#101725,#0b1019);border:1px solid var(--line);border-radius:20px;padding:16px;overflow:hidden}
#qualify{display:none}#bracket{display:none}.main-placeholder{color:var(--muted);text-align:center;padding:30px}.qual-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{padding:12px;border:1px solid #273248;border-radius:14px;background:#0b111b}.q strong{display:block;margin-bottom:6px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900;background:#18263b;color:var(--blue);margin:2px}.badge.gold{color:#161006;background:var(--gold)}
#bracket{display:none}.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}.round{min-width:0}.round h3{text-align:center;font-size:12px;color:var(--muted);letter-spacing:2px}.match{margin:12px 0;background:#0b111b;border:1px solid #26334a;border-radius:13px;overflow:hidden;box-shadow:0 10px 25px #0004}.slot{padding:10px 12px;border-bottom:1px solid #202b3e;display:flex;justify-content:space-between;gap:8px}.slot:last-child{border:0}.winner{color:var(--gold);font-weight:900}.vs{color:#66738a;font-size:10px}
.overlay{position:fixed;inset:0;background:#02040aee;display:none;align-items:center;justify-content:center;z-index:20}.overlay.show{display:flex;animation:flashIn .45s ease}.overlay.show:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff2 50%,transparent 65%);animation:sweep .8s ease-out}.particles{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:80px 80px;opacity:.13;animation:drift 8s linear infinite}.announce{text-align:center;animation:pop .7s ease}.announce .big{animation:glowPulse 1.2s ease-in-out infinite alternate;font-size:clamp(44px,12vw,100px);font-weight:1000;letter-spacing:-3px;background:linear-gradient(90deg,#fff,var(--gold),#fff);-webkit-background-clip:text;color:transparent}.announce .name{animation:nameRise .65s .12s both cubic-bezier(.16,1,.3,1);font-size:clamp(24px,6vw,52px);font-weight:900}.bar{width:min(500px,80vw);height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto}

@keyframes glowPulse{from{text-shadow:0 0 10px #ffd45a55,0 0 30px #ffd45a33;transform:scale(.98)}to{text-shadow:0 0 25px #ffd45aaa,0 0 70px #ffd45a55;transform:scale(1.04)}}
@keyframes drift{to{transform:translateY(80px)}}@keyframes nameRise{from{opacity:0;transform:translateY(35px) scale(.8);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes flashIn{from{opacity:0}to{opacity:1}}@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@keyframes pop{0%{opacity:0;transform:scale(.65) translateY(30px)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}.hint{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:900px){.groups{grid-template-columns:repeat(2,1fr)}.bracket{grid-template-columns:1fr 1fr}.round:nth-child(n+3){grid-column:span 2}}
@media(max-width:560px){.wrap{padding:12px}.groups{grid-template-columns:1fr}.qual-grid{grid-template-columns:1fr}.bracket{grid-template-columns:1fr}.round:nth-child(n+3){grid-column:auto}}

.setup{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 20%,#1a2947,#05070c 65%);display:flex;align-items:center;justify-content:center;padding:20px}
.setup-card{width:min(520px,100%);background:#0d1421;border:1px solid #2a3851;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0009;text-align:center}
.setup-card h1{font-size:30px;margin:0 0 8px}.setup-card p{color:var(--muted);font-size:13px;margin:0 0 22px}.event-input{font-size:18px;padding:15px;text-align:center;margin-bottom:12px}
.saved{font-size:12px;color:var(--green);min-height:18px;margin-bottom:10px}.event-name{color:var(--gold);font-weight:900;letter-spacing:1px}

</head>
<body>
<div class="setup" id="setup">
  <div class="setup-card">
    <div class="logo">TOURNAMENT MANAGEMENT</div>
    <h1>대회 시작</h1>
    <p>대회 이름을 입력하세요.<br>같은 대회 이름으로 다시 들어오면 저장된 예선·본선 데이터를 자동으로 불러옵니다.</p>
    <input id="tournamentName" class="event-input" placeholder="예: 2026 국가대항전" maxlength="50" autocomplete="off">
    <div class="saved" id="savedMessage"></div>
    <button onclick="enterTournament()">대회 시작하기</button>
  </div>
</div>
<header>
  <div class="logo">JINMOK TOURNAMENT SYSTEM</div>
  <div class="title" id="eventTitle">16 PLAYER • ROAD TO CHAMPION</div>
  <div class="sub">4개 조 × 4명 · 조 1~2위 자동 진출 · 3위 중 승점 TOP 2 진출</div>
</header>

<div class="wrap">
  <div class="tabs">
 <button class="tab active" onclick="switchTab('prelim',this)">예선</button>
 <button class="tab secondary" onclick="switchTab('main',this)">본선</button>
</div>
<div id="prelimTab">
<div class="toolbar"><button onclick="showStage()">LIVE STAGE</button>
    <button onclick="calculate()">진출자 계산 & 애니메이션</button>
    <button class="secondary" onclick="demo()">예시 데이터 입력</button>
    <button class="secondary" onclick="window.print()">결과 출력</button>
    <button class="danger" onclick="resetAll()">초기화</button>
  </div>

  <section>
    <h2>PRELIMINARY • 예선 입력</h2>
    <div class="groups" id="groups"></div>
    <div class="hint">이름과 승점을 입력하세요. 같은 승점이면 득실차 → 입력 순서로 정렬됩니다.</div>
  </section>
</div>

  <section id="qualify">
    <h2>QUALIFIED • 본선 진출자</h2>
    <div class="card"><div class="qual-grid" id="qualifiedList"></div></div>
  </section>

  <section id="bracket">
    <h2>MAIN TOURNAMENT • 본선 토너먼트</h2>
    <div class="card">
      <div class="bracket" id="bracketInner"></div>
      <div class="hint">본선은 10명 구조이므로 3위 진출자 2명이 플레이인에서 승리하면 8강에 합류하는 방식으로 자동 배치됩니다.</div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="particles"></div>
  <div class="announce">
    <div class="big" id="announceBig">QUALIFIED</div>
    <div class="bar"></div>
    <div class="name" id="announceName"></div>
  </div>
</div>

<script>
let currentTournament='';
let data=[];
function storageKey(name){return 'jinmok_tournament_' + name.trim().toLowerCase();}
function saveState(){
 if(!currentTournament)return;
 const state={
   tournament:currentTournament,
   points:Array.from({length:4},(_,g)=>Array.from({length:4},(_,i)=>document.getElementById(`p-${g}-${i}`).value)),
   diffs:Array.from({length:4},(_,g)=>Array.from({length:4},(_,i)=>document.getElementById(`d-${g}-${i}`).value)),
   qualified:data,
   savedAt:Date.now()
 };
 localStorage.setItem(storageKey(currentTournament),JSON.stringify(state));
}
function restoreState(state){
 state.points?.forEach((arr,g)=>arr.forEach((v,i)=>{const el=document.getElementById(`p-${g}-${i}`);if(el)el.value=v}));
 state.diffs?.forEach((arr,g)=>arr.forEach((v,i)=>{const el=document.getElementById(`d-${g}-${i}`);if(el)el.value=v}));
 if(Array.isArray(state.qualified)&&state.qualified.length){
   data=state.qualified;
   showQualified(data,[]);
 }
}
function enterTournament(){
 const input=document.getElementById('tournamentName').value.trim();
 if(!input){alert('대회 이름을 입력해주세요.');return}
 currentTournament=input;
 document.getElementById('eventTitle').textContent=input;
 const saved=localStorage.getItem(storageKey(input));
 document.getElementById('setup').style.display='none';
 if(saved){
   try{restoreState(JSON.parse(saved));}catch(e){}
 }else{
   saveState();
 }
}
document.getElementById('tournamentName').addEventListener('keydown',e=>{if(e.key==='Enter')enterTournament();});
window.addEventListener('beforeunload',saveState);
document.addEventListener('input',e=>{
 if(e.target.matches('input[type="number"]')) saveState();
});
const groupsEl=document.getElementById('groups');
const fixedGroups=[
 ['잉글랜드','크로아티아','브라질','일본'],
 ['체코','네덜란드','터키','한국'],
 ['벨기에','스페인','독일','프랑스'],
 ['이탈리아','포르투갈','아르헨티나','노르웨이']
];
function renderGroups(){
 groupsEl.innerHTML='';
 fixedGroups.forEach((names,g)=>{
  let html=`<div class="group"><h3>GROUP ${String.fromCharCode(65+g)}</h3><table>
  <thead><tr><th>COUNTRY</th><th>승점</th><th>득실차</th></tr></thead><tbody>`;
  names.forEach((name,i)=>html+=`<tr><td><strong>${name}</strong></td><td><input class="score" id="p-${g}-${i}" type="number" value="0" min="0"></td><td><input class="score" id="d-${g}-${i}" type="number" value="0"></td></tr>`);
  html+='</tbody></table></div>';
  groupsEl.innerHTML+=html;
 });
}
renderGroups();
function switchTab(tab,btn){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
 const prelim=document.getElementById('prelimTab');
 const qual=document.getElementById('qualify');
 const bracket=document.getElementById('bracket');
 if(tab==='prelim'){
   prelim.style.display='block';
   qual.style.display='none';
   bracket.style.display='none';
 }else{
   prelim.style.display='none';
   if(data && data.length){
     qual.style.display='block';
     bracket.style.display='block';
   }else{
     qual.style.display='none';
     bracket.style.display='none';
     alert('먼저 예선에서 수치를 입력하고 "진출자 계산 & 애니메이션"을 눌러주세요.');
   }
 }
}
function getGroups(){
 return Array.from({length:4},(_,g)=>Array.from({length:4},(_,i)=>({
  name:document.getElementById(`n-${g}-${i}`).value.trim()||`PLAYER ${g*4+i+1}`,
  points:+document.getElementById(`p-${g}-${i}`).value||0,
  diff:+document.getElementById(`d-${g}-${i}`).value||0,
  group:g
 })).sort((a,b)=>b.points-a.points||b.diff-a.diff));
}
function showStage(){
 const ov=document.getElementById('overlay');
 document.getElementById('announceBig').textContent='ROAD TO CHAMPION';
 document.getElementById('announceName').textContent='16 PLAYERS • 1 CHAMPION';
 ov.classList.add('show');
 setTimeout(()=>ov.classList.remove('show'),1800);
}
function calculate(){
 const gs=getGroups(); const direct=[]; const thirds=[];
 gs.forEach((arr,g)=>{arr.forEach((p,i)=>p.rank=i+1); direct.push(arr[0],arr[1]); thirds.push(arr[2]);});
 const thirdTop=thirds.sort((a,b)=>b.points-a.points||b.diff-a.diff).slice(0,2);
 const all=[...direct,...thirdTop];
 data=all;
 saveState();
 showQualified(all,thirds);
}
function showQualified(all,thirds){
 document.getElementById('qualify').style.display='block';
 document.getElementById('bracket').style.display='none';
 const box=document.getElementById('qualifiedList'); box.innerHTML='';
 const direct=all.filter(p=>p.rank<=2);
 const special=all.filter(p=>p.rank===3);
 let idx=0;
 const sequence=[...direct,...special];
 function next(){
   if(idx>=sequence.length){buildBracket(sequence); document.querySelectorAll('.tab')[1].disabled=false; return;}
   const p=sequence[idx++];
   const q=document.createElement('div');q.className='q';
   q.innerHTML=`<strong>${p.name}</strong><span class="badge ${p.rank<=2?'gold':''}">${p.rank<=2?'조 '+String.fromCharCode(65+p.group)+' '+p.rank+'위':'3위 와일드카드'}</span><span class="badge">${p.points} PTS</span>`;
   box.appendChild(q);
   document.getElementById('announceBig').textContent=p.rank<=2?'QUALIFIED':'WILDCARD';
   document.getElementById('announceName').textContent=p.name;
   const ov=document.getElementById('overlay');ov.classList.add('show');
   setTimeout(()=>{ov.classList.remove('show');setTimeout(next,120)},900);
 }
 next();
}
function buildBracket(players){
 document.getElementById('bracket').style.display='block';
 const direct=players.filter(p=>p.rank<=2);
 const wild=players.filter(p=>p.rank===3);
 // 8명의 직행자 + 2명의 와일드카드 = 10명. 와일드카드 2명은 플레이인.
 const matches=[
  [wild[0]?.name||'WILDCARD 1',direct[0]?.name||'8강 진출자'],
  [wild[1]?.name||'WILDCARD 2',direct[1]?.name||'8강 진출자']
 ];
 const rounds=[
  {title:'PLAY-IN',items:matches},
  {title:'QUARTER FINAL',items:[
    [direct[2]?.name||'TBD',direct[3]?.name||'TBD'],
    [direct[4]?.name||'TBD',direct[5]?.name||'TBD'],
    [direct[6]?.name||'TBD',direct[7]?.name||'TBD'],
    ['PLAY-IN #1','PLAY-IN #2']
  ]},
  {title:'SEMI FINAL',items:[['QF #1','QF #2'],['QF #3','QF #4']]},
  {title:'FINAL',items:[['SF #1','SF #2']]}
 ];
 const b=document.getElementById('bracketInner');b.innerHTML='';
 rounds.forEach(r=>{
   const col=document.createElement('div');col.className='round';
   col.innerHTML=`<h3>${r.title}</h3>`;
   r.items.forEach(m=>{
    const x=document.createElement('div');x.className='match';
    x.innerHTML=`<div class="slot">${m[0]}<span class="vs">VS</span></div><div class="slot">${m[1]}<span class="vs">VS</span></div>`;
    col.appendChild(x);
   });b.appendChild(col);
 });
}
function demo(){
 const pts=[[9,6,3,0],[8,7,4,1],[10,6,5,2],[7,6,4,3]];
 pts.forEach((arr,g)=>arr.forEach((v,i)=>{
   document.getElementById(`p-${g}-${i}`).value=v;
   document.getElementById(`d-${g}-${i}`).value=0;
 }));
 calculate();
}
function resetAll(){
 document.querySelectorAll('input').forEach((x,i)=>x.value=x.type==='number'?'0':'');
 document.getElementById('qualify').style.display='none';
 document.getElementById('bracket').style.display='none';
 saveState();
}
</script>
</body>
</html>
